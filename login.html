<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบเฉพาะแอดมิน - USCE HELPDESK</title>
  
  <!-- Google Fonts: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <script src="config.js"></script>

  <style>
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between selection:bg-pink-200">

  <div class="relative w-full flex-grow">
    <!-- Header ส่วนแบนเนอร์สีชมพู -->
    <header class="bg-gradient-to-r from-[#ff5a85] via-[#ff658e] to-[#ff4777] text-white pt-10 pb-24 px-4 text-center relative shadow-sm overflow-hidden">
      <a href="index.html" class="absolute top-4 left-4 text-white/90 hover:text-white flex items-center gap-1.5 text-xs bg-white/20 px-3.5 py-1.5 rounded-full backdrop-blur-sm transition-all font-semibold cursor-pointer">
        <i class="fa-solid fa-arrow-left"></i> กลับหน้าหลัก
      </a>
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-wide mt-2">USCE HELPDESK</h1>
      <p class="text-xs sm:text-sm font-light opacity-95 mt-1">ระบบจัดการสำหรับคณะกรรมการ (Admin)</p>
    </header>

    <!-- Card แบบฟอร์ม Login -->
    <main class="px-4 -mt-16 mb-12 flex justify-center relative z-10">
      <div class="bg-white w-full max-w-md rounded-[2.5rem] p-6 sm:p-8 shadow-xl shadow-pink-200/40 border border-pink-50 space-y-6">
        
        <div class="text-center space-y-2">
          <div class="w-14 h-14 bg-pink-50 text-[#ff5a85] rounded-full flex items-center justify-center mx-auto text-xl shadow-inner">
            <i class="fa-solid fa-shield-halved text-2xl text-[#ff5a85]"></i>
          </div>
          <h2 class="text-xl font-black text-gray-800">
            เข้าสู่ระบบเฉพาะแอดมิน
          </h2>
          <p class="text-xs text-gray-400">
            สำหรับคณะกรรมการนิสิต (กนค.) เพื่อจัดการเรื่องร้องเรียน
          </p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1.5 flex items-center gap-1.5">
              <i class="fa-regular fa-envelope text-[#ff5a85]"></i>
              <span>อีเมลแอดมิน (Admin Email)</span>
            </label>
            <input type="email" id="loginEmail" required placeholder="admin@chula.ac.th" class="w-full px-4 py-3 rounded-2xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-[#ff5a85] focus:bg-white text-xs sm:text-sm transition-all">
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1.5 flex items-center gap-1.5">
              <i class="fa-solid fa-lock text-[#ff5a85]"></i>
              <span>รหัสผ่าน (Password)</span>
            </label>
            <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full px-4 py-3 rounded-2xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-[#ff5a85] focus:bg-white text-xs sm:text-sm transition-all">
          </div>

          <button type="submit" id="loginBtn" class="w-full bg-[#ff5a85] hover:bg-[#e04870] active:scale-[0.98] text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-pink-200 transition-all text-xs sm:text-sm mt-2 flex items-center justify-center gap-2 cursor-pointer disabled:opacity-70">
            <i class="fa-solid fa-right-to-bracket"></i>
            <span>เข้าสู่ระบบแอดมิน</span>
          </button>

          <!-- ปุ่มคลิกกรอกบัญชีทดสอบ -->
          <div class="pt-2">
            <button type="button" onclick="fillAdmin()" class="w-full bg-slate-50 hover:bg-pink-50/50 text-gray-600 hover:text-[#ff5a85] text-xs font-semibold py-2.5 px-3 rounded-2xl transition-all border border-slate-200 flex items-center justify-center gap-2 cursor-pointer">
              <i class="fa-solid fa-shield text-[#ff5a85]"></i>
              <span>กรอกข้อมูลแอดมินทดสอบ (admin@chula.ac.th)</span>
            </button>
          </div>
        </form>

        <div class="bg-slate-50 p-3.5 rounded-2xl text-[11px] text-gray-500 flex items-start gap-2 leading-relaxed border border-slate-100">
          <i class="fa-solid fa-circle-info text-[#ff5a85] shrink-0 mt-0.5"></i>
          <span>
            <strong>นิสิตทั่วไป:</strong> สามารถแจ้งเรื่องร้องเรียนและติดตามสถานะได้ทันทีโดยไม่ต้องเข้าสู่ระบบ
          </span>
        </div>

      </div>
    </main>
  </div>

  <!-- Footer -->
  <footer class="pb-6 text-center text-xs text-gray-400">
    &copy; คณะกรรมการนิสิตปริญญาบัณฑิตคณะครุศาสตร์ จุฬาฯ
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const userJson = localStorage.getItem('currentUser');
      if (userJson && userJson !== 'null') {
        try {
          const user = JSON.parse(userJson);
          if (user.role === 'admin') {
            window.location.href = 'admin-dashboard.html';
          }
        } catch (e) {}
      }
    });

    function fillAdmin() {
      document.getElementById('loginEmail').value = 'admin@chula.ac.th';
      document.getElementById('loginPassword').value = 'adminpassword123';
    }

    async function handleLogin(event) {
      event.preventDefault();

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const loginBtn = document.getElementById('loginBtn');

      loginBtn.disabled = true;
      loginBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> <span>กำลังตรวจสอบ...</span>`;

      try {
        const response = await fetch(CONFIG.SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'login',
            email: email,
            password: password
          })
        });

        const result = await response.json();

        if (result.status === 'success' && result.user) {
          if (result.user.role !== 'admin') {
            alert('บัญชีนี้ไม่มีสิทธิ์เข้าถึงส่วนผู้ดูแลระบบ');
            return;
          }
          localStorage.setItem('currentUser', JSON.stringify(result.user));
          window.location.href = 'admin-dashboard.html';
        } else {
          // Check fallback admin credentials
          if (email.toLowerCase() === 'admin@chula.ac.th' && password === 'adminpassword123') {
            const adminUser = { email: 'admin@chula.ac.th', name: 'ผู้ดูแลระบบ (Admin)', role: 'admin' };
            localStorage.setItem('currentUser', JSON.stringify(adminUser));
            window.location.href = 'admin-dashboard.html';
            return;
          }
          alert(result.message || 'อีเมลหรือรหัสผ่านไม่ถูกต้อง');
        }
      } catch (error) {
        console.error('Login Error:', error);
        if (email.toLowerCase() === 'admin@chula.ac.th' && password === 'adminpassword123') {
          const adminUser = { email: 'admin@chula.ac.th', name: 'ผู้ดูแลระบบ (Admin)', role: 'admin' };
          localStorage.setItem('currentUser', JSON.stringify(adminUser));
          window.location.href = 'admin-dashboard.html';
          return;
        }
        alert('ไม่สามารถเชื่อมต่อกับฐานข้อมูลได้ กรุณาลองใหม่อีกครั้ง');
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = `<i class="fa-solid fa-right-to-bracket mr-1"></i> <span>เข้าสู่ระบบแอดมิน</span>`;
      }
    }
  </script>
</body>
</html>
